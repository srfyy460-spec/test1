<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل ربات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10141c;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 500px;
      background: #191f2b;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }

    input,
    textarea {
      background: #252c39;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #2481cc;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .85;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #11151d;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="panel">

    <h1>🤖 پنل کنترل ربات</h1>

    <input
      id="chatId"
      type="text"
      placeholder="Chat ID"
    >

    <textarea
      id="message"
      placeholder="پیام..."
    ></textarea>

    <button onclick="sendMessage()">
      📤 ارسال پیام
    </button>

    <button onclick="botStatus()">
      🟢 وضعیت ربات
    </button>

    <div id="result" class="result">
      آماده
    </div>

  </div>

  <script>

    function show(text) {
      document.getElementById("result").innerText = text;
    }

    async function sendMessage() {

      const chatId =
        document.getElementById("chatId").value.trim();

      const message =
        document.getElementById("message").value.trim();

      if (!chatId || !message) {
        show("❌ Chat ID و پیام را وارد کن.");
        return;
      }

      show(
        "📤 برای ارسال پیام، باید Workflow مربوط به دستور اجرا شود."
      );
    }

    async function botStatus() {

      show(
        "🟢 پنل فعال است.\nربات توسط GitHub Actions اجرا می‌شود."
      );

    }

  </script>

</body>
      </html>
