<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل کنترل ربات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10141c;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 500px;
      background: #191f2b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }

    input,
    textarea {
      background: #252c39;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #2481cc;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .85;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #11151d;
      border-radius: 10px;
      text-align: center;
      white-space: pre-line;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="panel">

  <h1>🤖 پنل کنترل ربات</h1>

  <input
    id="githubToken"
    type="password"
    placeholder="GitHub Token"
  >

  <input
    id="chatId"
    type="text"
    placeholder="Chat ID"
  >

  <textarea
    id="message"
    placeholder="پیام..."
  ></textarea>

  <button onclick="sendMessage()">
    📤 ارسال پیام
  </button>

  <div id="result" class="result">
    آماده
  </div>

</div>

<script>

async function sendMessage() {

  const githubToken =
    document.getElementById("githubToken").value.trim();

  const chatId =
    document.getElementById("chatId").value.trim();

  const message =
    document.getElementById("message").value.trim();

  if (!githubToken) {
    show("❌ GitHub Token را وارد کن.");
    return;
  }

  if (!chatId || !message) {
    show("❌ Chat ID و پیام را وارد کن.");
    return;
  }

  show("⏳ در حال ارسال دستور به GitHub...");

  // Repository
  const owner = "srfyy460-spec";
  const repo = "test1";

  const url =
    `https://api.github.com/repos/${owner}/${repo}/actions/workflows/command.yml/dispatches`;

  try {

    const response = await fetch(url, {

      method: "POST",

      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${githubToken}`,
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        ref: "main",

        inputs: {
          chat_id: chatId,
          message: message
        }
      })

    });

    if (response.status === 204) {

      show(
        "✅ دستور ارسال شد.\n" +
        "GitHub Actions در حال ارسال پیام است."
      );

    } else {

      const error =
        await response.text();

      show(
        "❌ خطای GitHub:\n" +
        error
      );

    }

  } catch (error) {

    show(
      "❌ خطا در ارتباط با GitHub:\n" +
      error.message
    );

  }
}


function show(text) {

  document.getElementById("result").innerText = text;

}

</script>

</body>
  </html>
