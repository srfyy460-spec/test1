<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل کنترل ربات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10141c;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 500px;
      background: #191f2b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .status {
      text-align: center;
      padding: 15px;
      margin: 20px 0;
      background: #11151d;
      border-radius: 12px;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }

    input,
    textarea {
      background: #252c39;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #2481cc;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .85;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #11151d;
      border-radius: 10px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="panel">

  <h1>🤖 پنل کنترل ربات</h1>

  <div id="status" class="status">
    ⚪ آماده
  </div>

  <button onclick="checkBot()">
    🔍 بررسی وضعیت ربات
  </button>

  <input
    id="chatId"
    type="text"
    placeholder="Chat ID"
  >

  <textarea
    id="message"
    placeholder="متن پیام..."
  ></textarea>

  <button onclick="sendMessage()">
    📤 ارسال پیام
  </button>

  <div id="result" class="result">
    آماده دریافت دستور
  </div>

</div>

<script>

async function checkBot() {
  setResult("⏳ در حال بررسی...");

  try {
    const response = await fetch("/api/bot-status");
    const data = await response.json();

    if (data.ok) {
      document.getElementById("status").innerHTML =
        "🟢 ربات آنلاین است";

      setResult(
        "نام ربات: " +
        (data.bot?.first_name || "نامشخص")
      );
    } else {
      document.getElementById("status").innerHTML =
        "🔴 ربات در دسترس نیست";

      setResult("❌ اتصال ناموفق");
    }

  } catch (error) {
    document.getElementById("status").innerHTML =
      "⚠️ API در دسترس نیست";

    setResult(
      "برای کنترل واقعی، درخواست باید از طریق GitHub Actions یا یک Backend اجرا شود."
    );
  }
}


async function sendMessage() {

  const chatId =
    document.getElementById("chatId").value.trim();

  const message =
    document.getElementById("message").value.trim();

  if (!chatId || !message) {
    setResult("❌ Chat ID و متن پیام را وارد کنید.");
    return;
  }

  setResult("⏳ در حال ارسال...");

  try {

    const response = await fetch("/api/send-message", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        chat_id: chatId,
        text: message
      })
    });

    const data = await response.json();

    if (data.ok) {
      setResult("✅ پیام با موفقیت ارسال شد.");
    } else {
      setResult(
        "❌ ارسال نشد: " +
        (data.description || "خطای نامشخص")
      );
    }

  } catch (error) {

    setResult(
      "⚠️ API در دسترس نیست."
    );

  }
}


function setResult(text) {
  document.getElementById("result").innerHTML = text;
}

</script>

</body>
  </html>
